<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DELMEN | Online Shopping</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f6fa;color:#222}
header{background:#111827;color:white;padding:18px 5%;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:26px;font-weight:bold;color:#facc15}
nav a{color:white;text-decoration:none;margin-left:15px}
.hero{text-align:center;padding:45px 15px;background:#e5e7eb}
.hero h1{font-size:32px;margin:0 0 10px}
.search{padding:13px;width:90%;max-width:450px;border:1px solid #ccc;border-radius:8px;margin-top:15px}
main{padding:25px 5%}
h2{margin-bottom:18px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px}
.card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 9px #0001}
.card img{width:100%;height:180px;object-fit:cover;background:#eee}
.info{padding:13px}
.info h3{margin:5px 0;font-size:17px}
.price{font-weight:bold;color:#087b45;font-size:18px}
.muted{color:#777;font-size:13px}
footer{text-align:center;padding:25px;background:#111827;color:white;margin-top:35px}
</style>
</head>
<body>
<header>
<div class="logo">DELMEN</div>
<nav><a href="#">Home</a><a href="#products">Products</a></nav>
</header>

<section class="hero">
<h1>Welcome to DELMEN</h1>
<p>Shop smart. Shop easy.</p>
<input class="search" id="search" placeholder="Search products...">
</section>

<main id="products">
<h2>Our Products</h2>
<div id="status">Loading products...</div>
<div class="products" id="productList"></div>
</main>

<footer>© 2026 DELMEN. All rights reserved.</footer>

<script>
const SUPABASE_URL = "https://ruahltldjmgwvawjemjz.supabase.co";
const SUPABASE_KEY = "sb_publishable_Os5W7DzczqybUijYunN2ig_HoyFkjAh";

let products = [];

async function loadProducts(){
 const status = document.getElementById("status");
 try{
  const response = await fetch(
   SUPABASE_URL + "/rest/v1/products?select=*&is_active=eq.true&order=created_at.desc",
   {
    headers:{
     "apikey":SUPABASE_KEY,
     "Authorization":"Bearer " + SUPABASE_KEY
    }
   }
  );
  if(!response.ok) throw new Error("Could not load products");
  products = await response.json();
  showProducts(products);
 }catch(error){
  status.textContent = "Products could not be loaded. Please try again.";
 }
}

function showProducts(items){
 const list = document.getElementById("productList");
 document.getElementById("status").textContent =
  items.length ? "" : "No products available yet.";
 list.innerHTML = "";
 items.forEach(product=>{
  const card = document.createElement("div");
  card.className = "card";
  const img = document.createElement("img");
  img.src = product.image_url || "https://placehold.co/400x300?text=DELMEN";
  img.alt = product.name || "Product";
  img.onerror = ()=>{img.src="https://placehold.co/400x300?text=DELMEN"};
  const info = document.createElement("div");
  info.className = "info";
  const name = document.createElement("h3");
  name.textContent = product.name || "Product";
  const price = document.createElement("div");
  price.className = "price";
  price.textContent = "₹" + (product.price ?? "");
  const description = document.createElement("p");
  description.className = "muted";
  description.textContent = product.description || "";
  info.append(name,price,description);
  card.append(img,info);
  list.appendChild(card);
 });
}

document.getElementById("search").addEventListener("input",e=>{
 const q = e.target.value.toLowerCase();
 showProducts(products.filter(p=>(p.name || "").toLowerCase().includes(q)));
});

loadProducts();
</script>
</body>
</html>
